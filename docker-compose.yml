services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - BACKUP_DISK=/backup
      - SCRIPTS_DIR=/scripts
      - PORT=3001
    volumes:
      - /run/media/amitp/Backup:/backup:ro
      - ./scripts:/scripts:ro
    restart: unless-stopped
    networks:
      - snapshot-net

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DOCKER=true
      - VITE_API_URL=http://api:3001
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - snapshot-net

networks:
  snapshot-net:
    driver: bridge
